[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-geocoding-pipeline"
version = "0.1.0"
description = "Reproducible inventory and geocoding pipeline for SAFE research data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.9"]

[project.scripts]
safe-geocoding-phase01 = "safe_geocoding_pipeline.phase01.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
