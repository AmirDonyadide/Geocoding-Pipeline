[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-geocoding-pipeline"
version = "0.2.0"
description = "Reproducible inventory and geocoding pipeline for SAFE research data"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5", "pyarrow==25.0.0"]

[project.optional-dependencies]
dev = ["mypy==1.20.2", "pytest==8.4.2", "ruff==0.15.14"]

[project.scripts]
safe-geocoding-phase01 = "safe_geocoding_pipeline.phase01.cli:main"
safe-geocoding-phase02 = "safe_geocoding_pipeline.phase02.cli:main"
safe-geocoding-phase03 = "safe_geocoding_pipeline.phase03.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safe_geocoding_pipeline.phase03" = [
    "resources/*.json",
    "resources/references/*.json",
    "resources/references/*/*.json",
    "resources/references/*/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: generated large-field tests",
    "production_reference: requires controlled production reference data",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
