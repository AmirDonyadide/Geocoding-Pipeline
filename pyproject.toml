[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-geocoding-pipeline"
version = "0.2.0"
description = "Reproducible inventory and geocoding pipeline for SAFE research data"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.5", "ftfy==6.3.1", "pyarrow==25.0.0"]

[project.optional-dependencies]
dev = ["mypy==1.20.2", "pytest==8.4.2", "ruff==0.15.14"]

[project.scripts]
safe-geocoding-stage00 = "safe_geocoding_pipeline.preprocessing.stage00_cli:main"
safe-geocoding-benchmark-sample = "safe_geocoding_pipeline.preprocessing.benchmark_cli:main"
safe-geocoding-stage02 = "safe_geocoding_pipeline.preprocessing.stage02_cli:main"
safe-geocoding-stage03 = "safe_geocoding_pipeline.preprocessing.stage03_cli:main"
safe-geocoding-stage04 = "safe_geocoding_pipeline.preprocessing.stage04_cli:main"
safe-geocoding-stage05 = "safe_geocoding_pipeline.preprocessing.stage05_cli:main"
safe-geocoding-stage06 = "safe_geocoding_pipeline.preprocessing.stage06_cli:main"
safe-geocoding-stage07-bundle = "safe_geocoding_pipeline.preprocessing.stage07_bundle_cli:main"
safe-geocoding-stage07-design = "safe_geocoding_pipeline.preprocessing.stage07_design_cli:main"
safe-geocoding-stage07-supervisor = "safe_geocoding_pipeline.preprocessing.stage07_supervisor_cli:main"
safe-geocoding-stage07 = "safe_geocoding_pipeline.preprocessing.stage07_cli:main"
safe-geocoding-stage07-review = "safe_geocoding_pipeline.preprocessing.stage07_review_cli:main"
safe-geocoding-stage07-quality = "safe_geocoding_pipeline.preprocessing.stage07_quality_cli:main"
safe-geocoding-stage07-context = "safe_geocoding_pipeline.preprocessing.stage07_context_cli:main"
safe-geocoding-stage07-eligibility = "safe_geocoding_pipeline.preprocessing.stage07_eligibility_cli:main"
safe-geocoding-stage07-v2-readiness = "safe_geocoding_pipeline.preprocessing.stage07_v2_readiness_cli:main"
safe-geocoding-stage07-v2-validation-selection = "safe_geocoding_pipeline.preprocessing.stage07_v2_validation_selection_cli:main"
safe-geocoding-stage08 = "safe_geocoding_pipeline.preprocessing.stage08_cli:main"
safe-geocoding-stage10 = "safe_geocoding_pipeline.preprocessing.stage10_cli:main"
safe-geocoding-stage09 = "safe_geocoding_pipeline.preprocessing.stage09_cli:main"
safe-geocoding-development-reporting = "safe_geocoding_pipeline.preprocessing.development_reporting_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"safe_geocoding_pipeline.preprocessing" = [
    "resources/references/*/*.json",
    "resources/references/*/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: generated large-field tests",
    "requires_production_transfer_payload: requires an ignored controlled production transfer payload",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = [
    "postal",
    "postal.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
